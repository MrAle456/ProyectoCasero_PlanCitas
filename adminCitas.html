    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <div class="container my-5">
      <div class="card">
        <div class="card-header">
          Ingresar Datos de la Cita
        </div>
        <div class="card-body">
          <h5 class="card-title">Pon lo que deseas</h5>
          <p class="card-text">Que te gustaria hacer?</p>
          <form>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" placeholder="Nombre de nuestra cita :)">
            </div>
            <div class="mb-3">
              <label for="detalles" class="form-label">Detalles</label>
              <textarea class="form-control" id="detalles" placeholder="Ingresa los detalles de la cita"></textarea>
            </div>
            <div class="mb-3">
              <label for="fecha" class="form-label">Fecha</label>
              <input type="date" class="form-control" id="fecha">
            </div>
            <div class="mb-3">
              <label for="hora" class="form-label">Hora</label>
              <input type="time" class="form-control" id="hora">
            </div>
            <div class="mb-3">
              <label for="lugar" class="form-label">Lugar</label>
              <select class="form-control" id="lugar">
                <option value="">Selecciona el lugar de cita</option>
                <option value="reunion">A</option>
                <option value="consulta">B</option>
                <option value="otro">C</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="tipo" class="form-label">Tipo de Cita</label>
              <select class="form-control" id="tipo">
                <option value="">Selecciona el tipo de cita</option>
                <option value="reunion">D</option>
                <option value="consulta">E</option>
                <option value="otro">F</option>
              </select>
            </div>

            <button type="submit" class="btn boton-verde">Guardar Cita</button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
